name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Typecheck migrated projects
        run: bun run check:projects

      - name: Typecheck browser games
        run: bun run check:browser-games

      - name: Game logic smoke checks
        run: bun run check:ports

      - name: Test
        run: bun run test --ci

      - name: Build
        run: bun run build
