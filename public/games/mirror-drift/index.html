<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror Drift</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: #05030f;
  color: #f4f0ff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: grid;
  place-items: center;
  padding: 12px;
  overflow: hidden;
}

#wrap {
  position: relative;
  height: 100%;
  aspect-ratio: 2 / 3;
  max-width: 100%;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 22px 70px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(167, 139, 250, 0.2);
}

canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud {
  position: absolute;
  inset: 0;
  padding: 14px 16px;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.hud .top { display: flex; justify-content: space-between; align-items: flex-start; }

.stat .k {
  font-size: 0.52rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(196, 181, 253, 0.75);
}

.stat .v {
  font-size: 1.5rem;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  line-height: 1.05;
  text-shadow: 0 0 20px rgba(167, 139, 250, 0.75);
}

.stat.right { text-align: right; }

#mult {
  align-self: center;
  margin-top: 4px;
  font-size: 1.15rem;
  font-weight: 800;
  color: #fde047;
  text-shadow: 0 0 22px rgba(253, 224, 71, 0.9);
  opacity: 0;
  transition: opacity 0.15s, transform 0.15s;
  transform: scale(0.85);
}

#mult.on { opacity: 1; transform: scale(1); }

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(5, 3, 15, 0.74);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

.overlay[hidden] { display: none; }

.panel {
  width: min(320px, 100%);
  text-align: center;
  padding: 26px 22px;
  border-radius: 18px;
  background: linear-gradient(165deg, rgba(45, 28, 84, 0.95), rgba(15, 9, 32, 0.97));
  border: 1px solid rgba(167, 139, 250, 0.28);
  box-shadow: 0 26px 70px rgba(0, 0, 0, 0.6);
}

.panel h2 {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #f0abfc, #67e8f9);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.panel p { font-size: 0.82rem; color: #b6a8d9; line-height: 1.55; margin-bottom: 14px; }

.scores { display: flex; gap: 9px; margin-bottom: 15px; }

.scores div {
  flex: 1;
  padding: 9px;
  border-radius: 11px;
  background: rgba(167, 139, 250, 0.1);
  border: 1px solid rgba(167, 139, 250, 0.2);
}

.scores .n { font-size: 1.25rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.scores .k { font-size: 0.52rem; letter-spacing: 0.14em; text-transform: uppercase; color: #b6a8d9; }
.scores .best .n { color: #fde047; }

.keys { font-size: 0.7rem; color: #8b7bb8; line-height: 1.9; margin-bottom: 15px; }

kbd {
  display: inline-block;
  min-width: 20px;
  padding: 2px 6px;
  border-radius: 5px;
  background: rgba(167, 139, 250, 0.16);
  border: 1px solid rgba(167, 139, 250, 0.28);
  border-bottom-width: 2px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.66rem;
  color: #ddd6fe;
}

button {
  font: inherit;
  font-size: 0.9rem;
  font-weight: 680;
  color: #1a0b2e;
  background: linear-gradient(140deg, #f5d0fe, #c084fc);
  border: none;
  border-radius: 11px;
  padding: 11px 28px;
  cursor: pointer;
  pointer-events: auto;
  box-shadow: 0 10px 26px rgba(192, 132, 252, 0.35);
  transition: transform 0.1s;
}

button:active { transform: translateY(1px); }

/* Touch controls, shown only on coarse pointers. */
#touch {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: none;
  gap: 8px;
  padding: 12px;
  pointer-events: auto;
}

#touch button {
  flex: 1;
  padding: 16px 0;
  font-size: 0.78rem;
  background: rgba(167, 139, 250, 0.16);
  color: #ede9fe;
  border: 1px solid rgba(167, 139, 250, 0.3);
  box-shadow: none;
}

@media (hover: none) and (pointer: coarse) {
  #touch { display: flex; }
}
</style>
</head>

<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="top">
      <div class="stat"><div class="k">Score</div><div class="v" id="score">0</div></div>
      <div class="stat right"><div class="k">Distance</div><div class="v" id="dist">0</div></div>
    </div>
    <div id="mult">DRIFT x1.0</div>
  </div>

  <div id="touch">
    <button data-hold="left">◀ Left</button>
    <button data-hold="drift">Drift</button>
    <button data-hold="right">Right ▶</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <h2 id="ov-title">Mirror Drift</h2>
      <p id="ov-text">You steer <strong>both</strong> cars at once — and they mirror each other. Thread them through the gaps together.</p>
      <div class="scores" id="ov-scores" hidden>
        <div><div class="n" id="ov-score">0</div><div class="k">Score</div></div>
        <div><div class="n" id="ov-dist">0</div><div class="k">Distance</div></div>
        <div class="best"><div class="n" id="ov-best">0</div><div class="k">Best</div></div>
      </div>
      <div class="keys">
        <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> steer both<br>
        hold <kbd>Space</kbd> to drift — less grip, more points
      </div>
      <button id="ov-btn">Drive</button>
    </div>
  </div>
</div>

<script src="./game.js"></script>
</body>

</html>
