<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Twins</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }

body {
  background: #0b0d14;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: grid;
  place-items: center;
  padding: 10px;
  overflow: hidden;
}

#wrap {
  position: relative;
  height: 100%;
  aspect-ratio: 10 / 16;
  max-width: 100%;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}

canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  pointer-events: none;
}

.overlay[hidden] { display: none; }

.panel {
  width: min(300px, 100%);
  text-align: center;
  padding: 26px 22px;
  border-radius: 18px;
  background: rgba(11, 13, 20, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #f5f6fa;
  pointer-events: auto;
}

.panel h2 { font-size: 1.7rem; font-weight: 800; letter-spacing: 0.06em; margin-bottom: 8px; }
.panel p { font-size: 0.82rem; color: #a5adc0; line-height: 1.6; margin-bottom: 16px; }

.scores { display: flex; gap: 9px; margin-bottom: 16px; }

.scores div {
  flex: 1;
  padding: 10px 6px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.scores .n { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.scores .k { font-size: 0.52rem; letter-spacing: 0.15em; text-transform: uppercase; color: #a5adc0; }

.keys { font-size: 0.68rem; color: #8890a6; line-height: 2; margin-bottom: 16px; }

kbd {
  display: inline-block;
  min-width: 19px;
  padding: 2px 6px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-bottom-width: 2px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.64rem;
}

button {
  font: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  color: #0b0d14;
  background: #f5f6fa;
  border: none;
  border-radius: 999px;
  padding: 12px 34px;
  cursor: pointer;
  transition: transform 0.1s;
}

button:active { transform: translateY(1px); }

button.ghost {
  margin-top: 9px;
  background: transparent;
  color: #a5adc0;
  border: 1px solid rgba(255, 255, 255, 0.18);
  padding: 10px 26px;
}

/* Pause control, mirroring the circular button in the reference. */
#pause-btn {
  position: absolute;
  top: 14px;
  left: 14px;
  width: 38px;
  height: 38px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.16);
  color: #f5f6fa;
  border: 1px solid rgba(255, 255, 255, 0.26);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  cursor: pointer;
  z-index: 3;
}

#pause-btn[hidden] { display: none; }
#pause-btn svg { fill: currentColor; }
#pause-btn:hover { background: rgba(255, 255, 255, 0.26); }
</style>
</head>

<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <button id="pause-btn" type="button" aria-label="Pause" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg>
  </button>

  <div class="overlay" id="overlay">
    <div class="panel">
      <h2 id="ov-title">TWINS</h2>
      <p id="ov-text">Two balls. Two courses. Hold a side to swing that ball out and over the spikes — the longer you hold, the wider the arc.</p>
      <div class="scores" id="ov-scores" hidden>
        <div><div class="n" id="ov-score">0</div><div class="k">Score</div></div>
        <div><div class="n" id="ov-best">0</div><div class="k">Best</div></div>
      </div>
      <div class="keys" id="ov-keys">
        touch: hold the left or right half<br>
        <kbd>←</kbd><kbd>→</kbd> &nbsp; <kbd>A</kbd><kbd>L</kbd> &nbsp; <kbd>Z</kbd><kbd>M</kbd> &nbsp; or click a half
      </div>
      <button id="ov-btn">Play</button>
      <button id="ov-btn2" class="ghost" hidden>Restart</button>
    </div>
  </div>
</div>

<script src="./game.js"></script>
</body>

</html>
