<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #111;
            width: min(800px, calc(100vw - 24px));
            height: auto;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 24px;
            color: #cbd5e1;
            pointer-events: none;
        }
        #message {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
        }
        #start-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e2e8f0;
            font-size: 16px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="pong" width="800" height="500"></canvas>
        <div id="ui">
            <span id="score-p1">0</span>
            <span id="score-p2">0</span>
        </div>
        <div id="message">P1: W/S · P2: ↑/↓ | First to 5 wins</div>
        <div id="start-msg">Press SPACE to start</div>
    </div>

    <script src="./game.js"></script>
</body>
</html>
