<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
#wrap{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.5)}
canvas{display:block;width:min(100vw,420px);height:auto;aspect-ratio:420/640}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="420" height="640"></canvas></div>
<script src="./game.js"></script>
</body>
</html>
